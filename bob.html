<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOB · MMRI Internal Assistant</title>
<style>
  :root {
    --maroon: #7A003C;
    --maroon-dark: #5c002d;
    --gold: #D4A24C;
    --gold-bright: #FDBF57;
    --paper: #FAF7F2;
    --paper-dim: #F1ECE3;
    --ink: #2B2420;
    --ink-soft: #6B6258;
    --line: #E3DACB;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: transparent; }

  #bob-chat-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 62px;
    height: 62px;
    background: var(--maroon);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(122,0,60,0.35);
    z-index: 9999;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  #bob-chat-bubble:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 26px rgba(122,0,60,0.45);
  }

  #bob-chat-bubble::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-bright);
    opacity: 0;
    animation: bob-pulse 2.6s ease-out infinite;
  }

  @keyframes bob-pulse {
    0% { opacity: 0.55; transform: scale(0.92); }
    70% { opacity: 0; transform: scale(1.18); }
    100% { opacity: 0; transform: scale(1.18); }
  }

  #bob-chat-bubble svg { width: 26px; height: 26px; fill: var(--gold-bright); position: relative; z-index: 1; }

  #bob-chat-window {
    position: fixed;
    bottom: 102px;
    right: 24px;
    width: 400px;
    height: 560px;
    background: var(--paper);
    border-radius: 18px;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(43,36,32,0.28), 0 2px 8px rgba(43,36,32,0.12);
    z-index: 9998;
    border: 1px solid var(--line);
  }

  #bob-chat-window.open {
    display: flex;
    animation: bob-rise 0.28s cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes bob-rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bob-header {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .bob-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-bright), var(--gold), var(--gold-bright));
  }

  .bob-header-text h3 {
    font-family: 'Georgia', serif;
    color: var(--gold-bright);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .bob-status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #6FCF97;
    box-shadow: 0 0 0 2px rgba(111,207,151,0.25);
    flex-shrink: 0;
  }

  .bob-header-text p {
    color: rgba(255,255,255,0.72);
    font-size: 11.5px;
    margin-top: 3px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.2px;
  }

  .bob-close {
    background: rgba(255,255,255,0.1);
    border: none;
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    font-family: Arial, sans-serif;
  }
  .bob-close:hover { background: rgba(255,255,255,0.22); }

  .bob-messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background:
      radial-gradient(circle at 100% 0%, rgba(122,0,60,0.025) 0%, transparent 55%),
      var(--paper);
  }

  .bob-messages::-webkit-scrollbar { width: 6px; }
  .bob-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .bob-msg {
    max-width: 85%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    animation: bob-msg-in 0.22s ease;
  }

  @keyframes bob-msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bob-msg.bot {
    background: #ffffff;
    color: var(--ink);
    align-self: flex-start;
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(43,36,32,0.04);
  }

  .bob-msg.user {
    background: var(--maroon);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .bob-typing {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid var(--line);
    padding: 13px 16px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .bob-typing span {
    width: 6px; height: 6px;
    background: var(--maroon);
    border-radius: 50%;
    opacity: 0.35;
    animation: bob-bounce 1.1s infinite ease-in-out;
  }
  .bob-typing span:nth-child(2) { animation-delay: 0.15s; }
  .bob-typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bob-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-4px); opacity: 0.9; }
  }

  .bob-report-btn {
    background: var(--gold-bright);
    color: var(--maroon-dark);
    border: none;
    border-radius: 8px;
    padding: 8px 13px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    transition: filter 0.15s;
  }
  .bob-report-btn:hover { filter: brightness(1.08); }

  .bob-input-area {
    padding: 13px 14px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 8px;
    background: var(--paper);
  }

  .bob-input-area input {
    flex: 1;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 22px;
    padding: 11px 16px;
    color: var(--ink);
    font-size: 14px;
    outline: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    transition: border-color 0.15s;
  }
  .bob-input-area input:focus { border-color: var(--maroon); }
  .bob-input-area input::placeholder { color: #B5AA98; }

  .bob-input-area button {
    background: var(--maroon);
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .bob-input-area button:hover { background: var(--maroon-dark); }
  .bob-input-area button svg { width: 17px; height: 17px; fill: var(--gold-bright); }
</style>
</head>
<body>

<div id="bob-chat-bubble" onclick="toggleBob()">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
  </svg>
</div>

<div id="bob-chat-window">
  <div class="bob-header">
    <div class="bob-header-text">
      <h3><span class="bob-status-dot"></span>BOB</h3>
      <p>MMRI Staff Only · Ask me about partners & projects</p>
    </div>
    <button class="bob-close" onclick="toggleBob()">✕</button>
  </div>

  <div class="bob-messages" id="bob-messages"></div>

  <div class="bob-input-area">
    <input type="text" id="bob-input" placeholder="Ask about a partner, project, or team..." onkeydown="if(event.key==='Enter') sendBobMessage()" />
    <button onclick="sendBobMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const API_URL = "https://mpal-chatbot.onrender.com";
  let conversation = [];
  let isOpen = false;
  let lastBobResponse = '';

  function toggleBob() {
    isOpen = !isOpen;
    const win = document.getElementById('bob-chat-window');
    if (isOpen) {
      win.classList.add('open');
      if (conversation.length === 0) {
        addMessage("bot", "Hi! I'm BOB, your internal MMRI assistant. I can help you find info about partners, past projects, and internal documents.\n\nWhat would you like to know?");
      }
    } else {
      win.classList.remove('open');
    }
  }

  function addMessage(role, text, showReport = false) {
    const messages = document.getElementById('bob-messages');
    const div = document.createElement('div');
    div.className = `bob-msg ${role}`;

    let content = text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');

    if (showReport) {
      content += `<div style="margin-top:10px;">
        <button class="bob-report-btn" onclick="downloadReport('${encodeURIComponent(text)}')">📄 Generate Report</button>
      </div>`;
    }

    div.innerHTML = content;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function addTyping() {
    const messages = document.getElementById('bob-messages');
    const div = document.createElement('div');
    div.className = 'bob-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function sendBobMessage() {
    const input = document.getElementById('bob-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    addMessage('user', text);
    conversation.push({ role: 'user', content: text });

    const typing = addTyping();

    try {
      const response = await fetch(`${API_URL}/api/bob`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversation })
      });
      const data = await response.json();
      typing.remove();
      const reply = data.response;
      lastBobResponse = reply;
      addMessage('bot', reply, true);
      conversation.push({ role: 'assistant', content: reply });
    } catch (err) {
      typing.remove();
      addMessage('bot', 'Sorry, I had trouble connecting. Please try again.');
    }
  }

  async function downloadReport(encodedResponse) {
    const bobResponse = decodeURIComponent(encodedResponse);
    const conversationText = conversation.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');

    try {
      const response = await fetch(`${API_URL}/api/report`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bob_response: bobResponse,
          conversation_summary: conversationText
        })
      });

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `MMRI_Report_${Date.now()}.pdf`;
      a.click();
      window.URL.revokeObjectURL(url);
    } catch (err) {
      addMessage('bot', 'Sorry, could not generate the report. Please try again.');
    }
  }
</script>
</body>
</html>
