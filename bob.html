<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOB · MMRI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F1523;
    --navy-mid: #141C2E;
    --navy-light: #1A2338;
    --blue: #007096;
    --blue-bright: #0099CC;
    --blue-dim: rgba(0,112,150,0.12);
    --gold: #FDBF57;
    --green: #00D084;
    --white: #FFFFFF;
    --ink: #C8D8E8;
    --ink-soft: #5A7A96;
    --line: rgba(255,255,255,0.06);
    --msg-bot: #1A2338;
    --msg-user: #007096;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Poppins', Arial, sans-serif; }

  #bob-bubble {
    position: fixed; bottom: 24px; right: 24px;
    width: 60px; height: 60px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 9999; background: var(--blue);
    box-shadow: 0 4px 20px rgba(0,112,150,0.4);
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
  }
  #bob-bubble:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(0,112,150,0.55); }
  #bob-bubble::before {
    content: ''; position: absolute; inset: -5px; border-radius: 50%;
    border: 1.5px solid rgba(0,153,204,0.4); opacity: 0;
    animation: ring-pulse 3s ease-out infinite;
  }
  @keyframes ring-pulse {
    0% { opacity: 0.6; transform: scale(0.9); }
    70% { opacity: 0; transform: scale(1.2); }
    100% { opacity: 0; }
  }
  #bob-bubble svg { width: 24px; height: 24px; fill: #fff; position: relative; z-index: 1; }

  #bob-window {
    position: fixed; bottom: 96px; right: 24px;
    width: 400px; height: 580px; border-radius: 16px;
    display: none; flex-direction: column; overflow: hidden;
    z-index: 9998; background: var(--navy);
    border: 1px solid rgba(0,112,150,0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,112,150,0.08);
  }
  #bob-window.open { display: flex; animation: window-rise 0.3s cubic-bezier(0.16,1,0.3,1); }
  @keyframes window-rise {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bob-header {
    background: var(--navy-mid); padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); flex-shrink: 0; position: relative;
  }
  .bob-header::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--blue) 50%, transparent);
    opacity: 0.4;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-avatar {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--blue), #005577);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,112,150,0.3);
  }
  .header-info { display: flex; flex-direction: column; gap: 1px; }
  .header-name {
    font-size: 14.5px; font-weight: 600; color: #fff;
    display: flex; align-items: center; gap: 6px;
  }
  .online-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green); animation: dot-glow 2.5s ease-in-out infinite;
  }
  @keyframes dot-glow {
    0%,100% { box-shadow: 0 0 4px var(--green); }
    50% { box-shadow: 0 0 10px var(--green), 0 0 20px rgba(0,208,132,0.3); }
  }
  .header-sub { font-size: 11px; color: var(--ink-soft); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .staff-badge {
    background: rgba(0,112,150,0.15); border: 1px solid rgba(0,112,150,0.3);
    color: var(--blue-bright); font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 12px; letter-spacing: 0.3px;
  }
  .header-close {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5); width: 26px; height: 26px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.15s; font-family: Arial, sans-serif;
  }
  .header-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

  .bob-messages {
    flex: 1; overflow-y: auto; padding: 16px 14px 8px;
    display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
  }
  .bob-messages::-webkit-scrollbar { width: 4px; }
  .bob-messages::-webkit-scrollbar-thumb { background: rgba(0,112,150,0.2); border-radius: 4px; }

  .bob-msg {
    max-width: 84%; padding: 10px 14px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.6;
    animation: msg-in 0.22s cubic-bezier(0.34,1.56,.64,1) both;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bob-msg.bot {
    background: var(--msg-bot); color: var(--ink); align-self: flex-start;
    border: 1px solid rgba(255,255,255,0.06); border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .bob-msg.bot strong { color: #fff; }
  .bob-msg.user {
    background: var(--msg-user); color: #fff; align-self: flex-end;
    border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(0,112,150,0.3);
  }
  .msg-receipt { font-size: 10px; color: rgba(255,255,255,0.35); text-align: right; margin-top: 4px; }

  .bob-typing {
    align-self: flex-start; background: var(--msg-bot);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 12px 16px; border-radius: 14px; border-bottom-left-radius: 4px;
    display: flex; gap: 5px; align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .bob-typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue-bright);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .bob-typing span:nth-child(2) { animation-delay: 0.15s; }
  .bob-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .bob-report-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(0,112,150,0.12); color: var(--blue-bright);
    border: 1px solid rgba(0,112,150,0.25); border-radius: 6px;
    padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
    margin-top: 8px; transition: all 0.15s; font-family: 'Poppins', Arial, sans-serif;
  }
  .bob-report-btn:hover { background: rgba(0,112,150,0.22); border-color: var(--blue-bright); }

  .bob-input-area {
    padding: 10px 12px 14px; border-top: 1px solid var(--line);
    background: var(--navy-mid); flex-shrink: 0;
  }
  .bob-input-row { display: flex; gap: 8px; align-items: center; }
  .bob-input-area input {
    flex: 1; background: var(--navy-light);
    border: 1px solid rgba(0,112,150,0.18); border-radius: 22px;
    padding: 10px 16px; color: var(--ink); font-size: 13.5px; outline: none;
    transition: all 0.15s; font-family: 'Poppins', Arial, sans-serif;
  }
  .bob-input-area input:focus { border-color: rgba(0,112,150,0.45); box-shadow: 0 0 0 3px rgba(0,112,150,0.08); }
  .bob-input-area input::placeholder { color: rgba(255,255,255,0.18); }
  .send-btn {
    background: var(--blue); border: none; border-radius: 50%;
    width: 40px; height: 40px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,112,150,0.3);
  }
  .send-btn:hover { background: var(--blue-bright); transform: scale(1.06); }
  .send-btn svg { width: 16px; height: 16px; fill: #fff; }
</style>
</head>
<body>

<div id="bob-bubble" onclick="toggleBob()">
  <svg viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
</div>

<div id="bob-window">
  <div class="bob-header">
    <div class="header-left">
      <div class="header-avatar">🤖</div>
      <div class="header-info">
        <div class="header-name"><span class="online-dot"></span>BOB</div>
        <div class="header-sub">MMRI Internal Assistant</div>
      </div>
    </div>
    <div class="header-right">
      <div class="staff-badge">STAFF ONLY</div>
      <button class="header-close" onclick="toggleBob()">✕</button>
    </div>
  </div>

  <div class="bob-messages" id="bob-messages"></div>

  <div class="bob-input-area">
    <div class="bob-input-row">
      <input type="text" id="bob-input" placeholder="Ask about partners, projects, workflows…" onkeydown="if(event.key==='Enter')sendBobMessage()" />
      <button class="send-btn" onclick="sendBobMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://mpal-chatbot.onrender.com";
  let conversation = [], isOpen = false;

  function toggleBob() {
    isOpen = !isOpen;
    const win = document.getElementById('bob-window');
    if (isOpen) {
      win.classList.add('open');
      if (conversation.length === 0) {
        addBotMessage("Hi! I'm BOB, MMRI's internal assistant. I can help you find info about partners, check project status, look up workflows, and search the knowledge base.\n\nWhat would you like to know?");
      }
    } else {
      win.classList.remove('open');
    }
  }

  function addBotMessage(text, showReport = false) {
    const messages = document.getElementById('bob-messages');
    const div = document.createElement('div');
    div.className = 'bob-msg bot';
    div.innerHTML = text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    if (showReport) {
      const btn = document.createElement('button');
      btn.className = 'bob-report-btn';
      btn.innerHTML = '📄 Export Report';
      btn.onclick = () => downloadReport(text);
      div.appendChild(btn);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function addUserMessage(text) {
    const messages = document.getElementById('bob-messages');
    const div = document.createElement('div');
    div.className = 'bob-msg user';
    const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = text.replace(/\n/g,'<br>') + `<div class="msg-receipt">✓✓ ${now}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function addTyping() {
    const messages = document.getElementById('bob-messages');
    const div = document.createElement('div');
    div.className = 'bob-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function sendBobMessage() {
    const input = document.getElementById('bob-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addUserMessage(text);
    conversation.push({ role: 'user', content: text });
    const typing = addTyping();
    try {
      const response = await fetch(`${API_URL}/api/bob`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversation })
      });
      const data = await response.json();
      typing.remove();
      const reply = data.response;
      addBotMessage(reply, true);
      conversation.push({ role: 'assistant', content: reply });
    } catch (err) {
      typing.remove();
      addBotMessage('Sorry, I had trouble connecting. Please try again.');
    }
  }

  async function downloadReport(bobResponse) {
    const conversationText = conversation.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');
    try {
      const response = await fetch(`${API_URL}/api/report`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bob_response: bobResponse, conversation_summary: conversationText })
      });
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `MMRI_Report_${Date.now()}.pdf`; a.click();
      window.URL.revokeObjectURL(url);
    } catch (err) {
      addBotMessage('Could not generate report. Please try again.');
    }
  }
</script>
</body>
</html>
