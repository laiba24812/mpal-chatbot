<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHOS · MMRI</title>
<style>
  :root {
    --maroon: #7A003C;
    --maroon-dark: #5c002d;
    --maroon-mid: #6b0035;
    --gold: #D4A24C;
    --gold-bright: #FDBF57;
    --gold-dim: #C49040;
    --paper: #FAF7F2;
    --paper-dim: #F1ECE3;
    --ink: #2B2420;
    --ink-soft: #6B6258;
    --line: #E3DACB;
    --chip-bg: #FFF8EE;
    --chip-border: #E8D5A8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Helvetica Neue', Arial, sans-serif; }

  #ethos-bubble {
    position: fixed;
    bottom: 24px; right: 24px;
    width: 64px; height: 64px;
    background: var(--maroon);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(122,0,60,0.38);
    z-index: 9999;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
  }
  #ethos-bubble:hover { transform: scale(1.08); box-shadow: 0 10px 30px rgba(122,0,60,0.5); }
  #ethos-bubble::before {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-bright);
    opacity: 0;
    animation: ring-pulse 3s ease-out infinite;
  }
  #ethos-bubble::after {
    content: '';
    position: absolute; inset: -12px;
    border-radius: 50%;
    border: 1px solid var(--gold-bright);
    opacity: 0;
    animation: ring-pulse 3s ease-out infinite 0.6s;
  }
  @keyframes ring-pulse {
    0% { opacity: 0.5; transform: scale(0.9); }
    70% { opacity: 0; transform: scale(1.2); }
    100% { opacity: 0; }
  }
  #ethos-bubble svg { width: 28px; height: 28px; fill: var(--gold-bright); position: relative; z-index: 1; }

  #ethos-window {
    position: fixed;
    bottom: 104px; right: 24px;
    width: 390px; height: 580px;
    background: var(--paper);
    border-radius: 20px;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(43,36,32,0.22), 0 4px 12px rgba(43,36,32,0.1);
    z-index: 9998;
    border: 1px solid var(--line);
  }
  #ethos-window.open {
    display: flex;
    animation: window-rise 0.32s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes window-rise {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .ethos-header {
    background: linear-gradient(145deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    padding: 16px 18px 14px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; overflow: hidden; flex-shrink: 0;
  }
  .ethos-header::before {
    content: '';
    position: absolute; top: -40px; right: -20px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(253,191,87,0.06);
  }
  .ethos-header::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 2.5px;
    background: linear-gradient(90deg, transparent, var(--gold-bright) 30%, var(--gold) 70%, transparent);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-avatar {
    width: 38px; height: 38px;
    background: rgba(253,191,87,0.12);
    border: 1.5px solid rgba(253,191,87,0.3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-avatar svg { width: 20px; height: 20px; fill: var(--gold-bright); }
  .header-title { display: flex; flex-direction: column; gap: 2px; }
  .header-name {
    font-family: 'Georgia', serif;
    color: var(--gold-bright);
    font-size: 15.5px; font-weight: 600; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 6px;
  }
  .online-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #6FCF97;
    box-shadow: 0 0 0 2px rgba(111,207,151,0.3);
    animation: dot-breathe 2.5s ease-in-out infinite;
  }
  @keyframes dot-breathe {
    0%, 100% { box-shadow: 0 0 0 2px rgba(111,207,151,0.3); }
    50% { box-shadow: 0 0 0 4px rgba(111,207,151,0.15); }
  }
  .header-sub { color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: 0.15px; }
  .header-close {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.8);
    width: 28px; height: 28px;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: background 0.15s;
    font-family: Arial, sans-serif;
  }
  .header-close:hover { background: rgba(255,255,255,0.18); }

  .ethos-messages {
    flex: 1; overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
    background: radial-gradient(ellipse at 80% 0%, rgba(122,0,60,0.03) 0%, transparent 60%), var(--paper);
    scroll-behavior: smooth;
  }
  .ethos-messages::-webkit-scrollbar { width: 4px; }
  .ethos-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .ethos-msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13.5px; line-height: 1.58;
    animation: msg-in 0.24s cubic-bezier(0.34,1.56,.64,1) both;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .ethos-msg.bot {
    background: #ffffff; color: var(--ink);
    align-self: flex-start;
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(43,36,32,0.06);
  }
  .ethos-msg.user {
    background: linear-gradient(145deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: #fff; align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(122,0,60,0.2);
  }

  .ethos-typing {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid var(--line);
    padding: 12px 16px;
    border-radius: 16px; border-bottom-left-radius: 4px;
    display: flex; gap: 5px; align-items: center;
    box-shadow: 0 1px 3px rgba(43,36,32,0.06);
  }
  .ethos-typing span {
    width: 7px; height: 7px;
    border-radius: 50%; background: var(--maroon);
    animation: typing-dot 1.3s ease-in-out infinite;
  }
  .ethos-typing span:nth-child(1) { animation-delay: 0s; }
  .ethos-typing span:nth-child(2) { animation-delay: 0.18s; }
  .ethos-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing-dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .match-card {
    margin-top: 6px; padding: 12px 14px;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    border-radius: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .match-card.secondary { opacity: 0.6; }
  .match-label { color: rgba(255,255,255,0.6); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; }
  .match-name { color: var(--gold-bright); font-size: 13.5px; font-weight: 700; margin-top: 2px; }
  .match-conf { color: rgba(255,255,255,0.5); font-size: 10.5px; margin-top: 1px; }
  .scope-btn {
    background: var(--gold-bright); color: var(--maroon-dark);
    border: none; border-radius: 8px;
    padding: 7px 12px; font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: filter 0.15s, transform 0.1s;
  }
  .scope-btn:hover { filter: brightness(1.08); transform: scale(1.03); }

  .chip-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 4px 0 2px;
    animation: msg-in 0.3s ease both;
  }
  .chip {
    background: var(--chip-bg);
    border: 1.5px solid var(--chip-border);
    color: var(--maroon);
    border-radius: 20px; padding: 6px 13px;
    font-size: 12.5px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .chip:hover { background: var(--paper-dim); border-color: var(--maroon); transform: translateY(-1px); }

  .followup-btn {
    display: block; width: 100%;
    background: #fff;
    border: 1.5px solid var(--chip-border);
    border-radius: 10px; color: var(--maroon);
    padding: 9px 13px; font-size: 13px;
    cursor: pointer; text-align: left; margin-top: 5px;
    transition: background 0.15s, border-color 0.15s;
  }
  .followup-btn:hover { background: var(--paper-dim); border-color: var(--maroon); }

  .calendly-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--maroon); color: #fff;
    text-decoration: none;
    padding: 10px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    margin-top: 10px;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(122,0,60,0.2);
  }
  .calendly-btn:hover { background: var(--maroon-dark); transform: translateY(-1px); }

  .ethos-input-area {
    padding: 10px 12px 14px;
    border-top: 1px solid var(--line);
    background: var(--paper); flex-shrink: 0;
  }
  .ethos-input-row { display: flex; gap: 8px; align-items: flex-end; }
  .ethos-input-area input {
    flex: 1; background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 22px; padding: 11px 16px;
    color: var(--ink); font-size: 13.5px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .ethos-input-area input:focus {
    border-color: var(--maroon);
    box-shadow: 0 0 0 3px rgba(122,0,60,0.08);
  }
  .ethos-input-area input::placeholder { color: #B5AA98; }
  .send-btn {
    background: var(--maroon); border: none; border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(122,0,60,0.22);
  }
  .send-btn:hover { background: var(--maroon-dark); transform: scale(1.06); }
  .send-btn svg { width: 17px; height: 17px; fill: var(--gold-bright); }
</style>
</head>
<body>

<div id="ethos-bubble" onclick="toggleEthos()">
  <svg viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
</div>

<div id="ethos-window">
  <div class="ethos-header">
    <div class="header-left">
      <div class="header-avatar">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      </div>
      <div class="header-title">
        <div class="header-name"><span class="online-dot"></span>ETHOS</div>
        <div class="header-sub">McMaster Manufacturing Research Institute</div>
      </div>
    </div>
    <button class="header-close" onclick="toggleEthos()">✕</button>
  </div>

  <div class="ethos-messages" id="ethos-messages"></div>

  <div class="ethos-input-area">
    <div class="ethos-input-row">
      <input type="text" id="ethos-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://mpal-chatbot.onrender.com";
  const CALENDLY_LINK = "https://calendly.com/yousafzl-mcmaster/mmri-intro-call-15-min";
  let conversation = [];
  let isOpen = false;
  let msgCount = 0;
  let projectCreated = false;

  const QUICK_REPLIES = {
    greeting: ["Tell me about MMRI", "I have a manufacturing problem", "I'm looking for testing services", "I need training support"],
    project_type: ["Fee-for-service", "Looking for funding (NSERC, ORF, etc.)", "Not sure yet"],
    budget: ["Under $5,000", "$5,000 – $15,000", "$15,000 – $50,000", "Over $50,000"],
    referral: ["LinkedIn", "Google", "Word of mouth", "McMaster connection", "Conference or event"],
  };

  function toggleEthos() {
    isOpen = !isOpen;
    const win = document.getElementById('ethos-window');
    if (isOpen) {
      win.classList.add('open');
      if (conversation.length === 0) {
        setTimeout(() => {
          addMessage("bot", "Hi there! I'm ETHOS, MMRI's intake assistant. This'll work like a quick 15-minute consult — I'll ask you a few things and connect you with the right team.\n\nTo get us started, what's your name and company?");
          setTimeout(() => addChips(QUICK_REPLIES.greeting), 400);
        }, 200);
      }
    } else {
      win.classList.remove('open');
    }
  }

  function addChips(options) {
    const messages = document.getElementById('ethos-messages');
    const row = document.createElement('div');
    row.className = 'chip-row';
    options.forEach(opt => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = opt;
      chip.onclick = () => { row.remove(); handleChip(opt); };
      row.appendChild(chip);
    });
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function handleChip(text) {
    addMessage('user', text);
    conversation.push({ role: 'user', content: text });
    callAPI();
  }

  function addMessage(role, text) {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = `ethos-msg ${role}`;
    div.style.animationDelay = `${Math.min(msgCount * 0.04, 0.12)}s`;
    msgCount++;

    if (role === 'user') {
      div.innerHTML = text.replace(/\n/g, '<br>');
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    const matchLines = [...text.matchAll(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g)];
    const followupLines = [...text.matchAll(/FOLLOWUP:\s*(.+)/g)];
    let displayText = text
      .replace(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g, '')
      .replace(/FOLLOWUP:\s*(.+)/g, '')
      .replace(/https:\/\/calendly\.com\/[^\s)]+/g, '')
      .replace(/\*\*/g, '')
      .trim();

    let badges = '';
    if (matchLines.length > 0) {
      if (!projectCreated) {
        projectCreated = true;
        const convText = conversation.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');
        fetch(`${API_URL}/api/create-project`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matched_team: matchLines[0][1].trim(), conversation_summary: convText })
        }).catch(e => console.error('Project creation failed:', e));
      }
      badges = '<div style="display:flex;flex-direction:column;gap:7px;margin-top:10px;">';
      matchLines.forEach((m, i) => {
        const label = i === 0 ? 'Best match' : 'Also relevant';
        badges += `<div class="match-card${i > 0 ? ' secondary' : ''}">
          <div>
            <div class="match-label">${label}</div>
            <div class="match-name">${m[1].trim()}</div>
            <div class="match-conf">${m[2]}% confidence</div>
          </div>
          ${i === 0 ? `<button class="scope-btn" onclick="downloadScoping('${m[1].trim().replace(/'/g,"\\'")}','${m[2]}')">📄 Scoping doc</button>` : ''}
        </div>`;
      });
      badges += '</div>';
    }

    let followups = '';
    if (followupLines.length > 0) {
      followupLines.forEach(f => {
        followups += `<button class="followup-btn" onclick="answerFollowup('${f[1].replace(/'/g,"\\'")}')">💬 ${f[1]}</button>`;
      });
    }

    let calendlyButton = '';
    if (matchLines.length > 0) {
      calendlyButton = `<div style="margin-top:10px;">
        <a class="calendly-btn" href="${CALENDLY_LINK}" target="_blank">📅 Book a meeting</a>
      </div>`;
    }

    div.innerHTML = displayText.replace(/\n/g, '<br>') + badges + followups + calendlyButton;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    detectContextChips(displayText);
    return div;
  }

  function detectContextChips(text) {
    const lower = text.toLowerCase();
    if (lower.includes('how did you hear') || lower.includes('hear about')) {
      setTimeout(() => addChips(QUICK_REPLIES.referral), 300);
    } else if (lower.includes('fee-for-service') || lower.includes('funding') || lower.includes('project type')) {
      setTimeout(() => addChips(QUICK_REPLIES.project_type), 300);
    } else if (lower.includes('budget') || lower.includes('invest')) {
      setTimeout(() => addChips(QUICK_REPLIES.budget), 300);
    }
  }

  function addTyping() {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = 'ethos-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function callAPI() {
    const typing = addTyping();
    try {
      const response = await fetch(`${API_URL}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversation })
      });
      const data = await response.json();
      typing.remove();
      const reply = data.response;
      addMessage('bot', reply);
      conversation.push({ role: 'assistant', content: reply });
    } catch (err) {
      typing.remove();
      addMessage('bot', 'Sorry, I had trouble connecting. Please try again or email mmri-ad@mcmaster.ca');
    }
  }

  async function sendMessage() {
    const input = document.getElementById('ethos-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    document.querySelectorAll('.chip-row').forEach(r => r.remove());
    addMessage('user', text);
    conversation.push({ role: 'user', content: text });
    callAPI();
  }

  async function answerFollowup(question) {
    document.querySelectorAll('.followup-btn').forEach(b => b.remove());
    addMessage('user', question);
    conversation.push({ role: 'user', content: question });
    callAPI();
  }

  async function downloadScoping(team, confidence) {
    addMessage('bot', 'Generating your scoping document — just a moment…');
    const conversationText = conversation.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');
    try {
      const response = await fetch(`${API_URL}/api/scoping`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ matched_team: team, confidence: confidence, conversation_summary: conversationText })
      });
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `MMRI_Scoping_${team.replace(/\s+/g,'_')}.pdf`;
      a.click();
      window.URL.revokeObjectURL(url);
    } catch (err) {
      addMessage('bot', 'Sorry, could not generate the scoping document. Please try again.');
    }
  }
</script>
</body>
</html>
