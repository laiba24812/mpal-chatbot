<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHOS · MMRI</title>
<style>
  :root {
    --maroon: #7A003C;
    --maroon-dark: #5c002d;
    --maroon-mid: #6b0035;
    --gold: #D4A24C;
    --gold-bright: #FDBF57;
    --paper: #FAF7F2;
    --paper-dim: #F1ECE3;
    --ink: #2B2420;
    --ink-soft: #6B6258;
    --line: #E3DACB;
    --chip-bg: #FFF8EE;
    --chip-border: #E8D5A8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Helvetica Neue', Arial, sans-serif; }

  /* ── Bubble ── */
  #ethos-bubble {
    position: fixed; bottom: 24px; right: 24px;
    width: 64px; height: 64px;
    background: var(--maroon); border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(122,0,60,0.38); z-index: 9999;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
  }
  #ethos-bubble:hover { transform: scale(1.08); box-shadow: 0 10px 30px rgba(122,0,60,0.5); }
  #ethos-bubble::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 1.5px solid var(--gold-bright); opacity: 0;
    animation: ring-pulse 3s ease-out infinite;
  }
  #ethos-bubble::after {
    content: ''; position: absolute; inset: -12px; border-radius: 50%;
    border: 1px solid var(--gold-bright); opacity: 0;
    animation: ring-pulse 3s ease-out infinite 0.6s;
  }
  @keyframes ring-pulse {
    0% { opacity: 0.5; transform: scale(0.9); }
    70% { opacity: 0; transform: scale(1.2); }
    100% { opacity: 0; }
  }
  #ethos-bubble svg { width: 28px; height: 28px; fill: var(--gold-bright); position: relative; z-index: 1; }
  #ethos-bubble .bubble-icon { transition: opacity 0.2s; }

  /* ── Window ── */
  #ethos-window {
    position: fixed; bottom: 104px; right: 24px;
    width: 390px; height: 620px;
    background: var(--paper); border-radius: 20px;
    display: none; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(43,36,32,0.22), 0 4px 12px rgba(43,36,32,0.1);
    z-index: 9998; border: 1px solid var(--line);
  }
  #ethos-window.open { display: flex; animation: window-rise 0.32s cubic-bezier(0.16,1,0.3,1); }
  @keyframes window-rise {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Splash screen ── */
  #ethos-splash {
    position: absolute; inset: 0; z-index: 10;
    background: linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; border-radius: 20px;
    animation: splash-in 0.35s cubic-bezier(0.16,1,0.3,1);
  }
  #ethos-splash.hiding { animation: splash-out 0.4s cubic-bezier(0.4,0,1,1) forwards; }
  @keyframes splash-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes splash-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.04); } }
  .splash-logo {
    width: 72px; height: 72px;
    background: rgba(253,191,87,0.12);
    border: 2px solid rgba(253,191,87,0.35);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    animation: logo-pulse 2s ease-in-out infinite;
  }
  @keyframes logo-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(253,191,87,0.2); }
    50% { box-shadow: 0 0 0 12px rgba(253,191,87,0); }
  }
  .splash-logo svg { width: 36px; height: 36px; fill: var(--gold-bright); }
  .splash-title { font-family: 'Georgia', serif; color: var(--gold-bright); font-size: 28px; font-weight: 600; }
  .splash-sub { color: rgba(255,255,255,0.65); font-size: 13px; text-align: center; max-width: 240px; line-height: 1.5; }
  .splash-divider { width: 40px; height: 1.5px; background: rgba(253,191,87,0.3); border-radius: 2px; }
  .splash-btn {
    background: var(--gold-bright); color: var(--maroon-dark);
    border: none; border-radius: 24px; padding: 12px 28px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    margin-top: 8px; transition: transform 0.15s, filter 0.15s;
    box-shadow: 0 4px 16px rgba(253,191,87,0.3);
  }
  .splash-btn:hover { transform: scale(1.04); filter: brightness(1.06); }
  .splash-tagline { color: rgba(255,255,255,0.4); font-size: 10.5px; letter-spacing: 0.3px; }

  /* ── Header ── */
  .ethos-header {
    background: linear-gradient(145deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    padding: 14px 18px 12px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; overflow: hidden; flex-shrink: 0;
  }
  .ethos-header::before {
    content: ''; position: absolute; top: -40px; right: -20px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(253,191,87,0.06);
  }
  .ethos-header::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2.5px;
    background: linear-gradient(90deg, transparent, var(--gold-bright) 30%, var(--gold) 70%, transparent);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-avatar {
    width: 36px; height: 36px;
    background: rgba(253,191,87,0.12);
    border: 1.5px solid rgba(253,191,87,0.3);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .avatar-face {
    font-size: 20px; line-height: 1;
    transition: opacity 0.25s;
    position: absolute;
  }
  .avatar-face.hidden { opacity: 0; }
  .header-name {
    font-family: 'Georgia', serif; color: var(--gold-bright);
    font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 6px;
  }
  .online-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #6FCF97;
    box-shadow: 0 0 0 2px rgba(111,207,151,0.3);
    animation: dot-breathe 2.5s ease-in-out infinite;
  }
  @keyframes dot-breathe {
    0%,100% { box-shadow: 0 0 0 2px rgba(111,207,151,0.3); }
    50% { box-shadow: 0 0 0 4px rgba(111,207,151,0.15); }
  }
  .header-sub { color: rgba(255,255,255,0.6); font-size: 10.5px; margin-top: 2px; }
  .header-close {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.8); width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 13px; transition: background 0.15s; font-family: Arial, sans-serif;
  }
  .header-close:hover { background: rgba(255,255,255,0.2); }

  /* ── Progress ── */
  .progress-bar-wrap { background: rgba(0,0,0,0.15); height: 3px; flex-shrink: 0; }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--gold-bright), var(--gold));
    transition: width 0.6s cubic-bezier(0.34,1.56,.64,1); border-radius: 0 2px 2px 0;
  }
  .progress-label {
    background: rgba(122,0,60,0.04); border-bottom: 1px solid var(--line);
    padding: 5px 14px; font-size: 10.5px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .progress-label span { color: var(--maroon); font-weight: 600; }

  /* ── Summary panel ── */
  #summary-panel {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 8px 14px; flex-shrink: 0; display: none;
  }
  #summary-panel.visible { display: block; }
  .summary-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-soft); font-weight: 600; margin-bottom: 6px; }
  .summary-grid { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .summary-item { font-size: 11px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; }
  .summary-item.filled { color: var(--ink); }
  .scheck { color: #52B788; font-size: 10px; }
  .spend { color: #B5AA98; font-size: 10px; }

  /* ── Messages ── */
  .ethos-messages {
    flex: 1; overflow-y: auto; padding: 14px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
    background: radial-gradient(ellipse at 80% 0%, rgba(122,0,60,0.03) 0%, transparent 60%), var(--paper);
    scroll-behavior: smooth;
  }
  .ethos-messages::-webkit-scrollbar { width: 4px; }
  .ethos-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .ethos-msg {
    max-width: 82%; padding: 10px 14px; border-radius: 16px;
    font-size: 13.5px; line-height: 1.58;
    animation: msg-in 0.26s cubic-bezier(0.34,1.56,.64,1) both;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .ethos-msg.bot {
    background: #fff; color: var(--ink); align-self: flex-start;
    border: 1px solid var(--line); border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(43,36,32,0.06);
  }
  .ethos-msg.user {
    background: linear-gradient(145deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: #fff; align-self: flex-end; border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(122,0,60,0.2);
  }
  .msg-receipt {
    font-size: 10px; color: rgba(255,255,255,0.55);
    text-align: right; margin-top: 3px; letter-spacing: 0.2px;
  }

  /* ── Typing ── */
  .ethos-typing {
    align-self: flex-start; background: #fff; border: 1px solid var(--line);
    padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 4px;
    display: flex; gap: 5px; align-items: center;
    box-shadow: 0 1px 3px rgba(43,36,32,0.06);
  }
  .ethos-typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--maroon);
    animation: typing-dot 1.3s ease-in-out infinite;
  }
  .ethos-typing span:nth-child(2) { animation-delay: 0.18s; }
  .ethos-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing-dot {
    0%,60%,100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Match searching ── */
  .match-searching {
    align-self: flex-start; background: #fff; border: 1px solid var(--line);
    padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 4px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft);
    box-shadow: 0 1px 3px rgba(43,36,32,0.06); animation: msg-in 0.26s ease both;
  }
  .search-spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--maroon);
    animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Match card ── */
  .match-card {
    margin-top: 6px; padding: 12px 14px;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    animation: match-reveal 0.5s cubic-bezier(0.34,1.56,.64,1) both;
    box-shadow: 0 4px 16px rgba(122,0,60,0.3);
  }
  @keyframes match-reveal {
    from { opacity: 0; transform: scale(0.92) translateY(6px); }
    60% { box-shadow: 0 4px 20px rgba(253,191,87,0.25); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .match-card.secondary { opacity: 0.6; box-shadow: none; animation: msg-in 0.3s ease both; }
  .match-label { color: rgba(255,255,255,0.6); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; }
  .match-name { color: var(--gold-bright); font-size: 13px; font-weight: 700; margin-top: 2px; }
  .match-conf { color: rgba(255,255,255,0.5); font-size: 10.5px; margin-top: 1px; }
  .scope-btn {
    background: var(--gold-bright); color: var(--maroon-dark); border: none; border-radius: 8px;
    padding: 7px 11px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
    transition: filter 0.15s, transform 0.1s;
  }
  .scope-btn:hover { filter: brightness(1.08); transform: scale(1.04); }

  /* ── Celebration ── */
  .celebration {
    text-align: center; font-size: 28px; padding: 4px 0;
    animation: celebrate 0.6s cubic-bezier(0.34,1.56,.64,1) both; align-self: center;
  }
  @keyframes celebrate {
    from { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* ── Chips ── */
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0; animation: msg-in 0.3s ease both; }
  .chip {
    background: var(--chip-bg); border: 1.5px solid var(--chip-border);
    color: var(--maroon); border-radius: 20px; padding: 6px 13px;
    font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .chip:hover { background: var(--paper-dim); border-color: var(--maroon); transform: translateY(-1px); }

  /* ── Followups ── */
  .followup-btn {
    display: block; width: 100%; background: #fff;
    border: 1.5px solid var(--chip-border); border-radius: 10px;
    color: var(--maroon); padding: 9px 13px; font-size: 13px;
    cursor: pointer; text-align: left; margin-top: 5px;
    transition: background 0.15s, border-color 0.15s;
  }
  .followup-btn:hover { background: var(--paper-dim); border-color: var(--maroon); }

  /* ── Calendly ── */
  .calendly-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--maroon); color: #fff; text-decoration: none;
    padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    margin-top: 10px; transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(122,0,60,0.2);
  }
  .calendly-btn:hover { background: var(--maroon-dark); transform: translateY(-1px); }

  /* ── Input ── */
  .ethos-input-area { padding: 10px 12px 14px; border-top: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
  .ethos-input-row { display: flex; gap: 8px; align-items: center; }
  .ethos-input-area input {
    flex: 1; background: #fff; border: 1.5px solid var(--line); border-radius: 22px;
    padding: 11px 16px; color: var(--ink); font-size: 13.5px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .ethos-input-area input:focus { border-color: var(--maroon); box-shadow: 0 0 0 3px rgba(122,0,60,0.08); }
  .ethos-input-area input::placeholder { color: #B5AA98; }
  .send-btn {
    background: var(--maroon); border: none; border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 0.15s, transform 0.1s; box-shadow: 0 2px 8px rgba(122,0,60,0.22);
  }
  .send-btn:hover { background: var(--maroon-dark); transform: scale(1.06); }
  .send-btn svg { width: 17px; height: 17px; fill: var(--gold-bright); }
</style>
</head>

<!-- Audio context for subtle sounds -->
<script>
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playChime(freq = 880, duration = 0.18, vol = 0.06) {
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(); osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }
  function playSuccess() {
    try {
      const ctx = getAudio();
      [523, 659, 784].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f; osc.type = 'sine';
        const t = ctx.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0.07, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      });
    } catch(e) {}
  }
</script>

<script>
  const API_URL = "https://mpal-chatbot.onrender.com";
  const CALENDLY_LINK = "https://calendly.com/yousafzl-mcmaster/mmri-intro-call-15-min";
  const STORAGE_KEY = "ethos_conversation";

  let conversation = [];
  let isOpen = false;
  let projectCreated = false;
  let step = 0;
  let summaryData = {};
  let chatStarted = false;

  const STEPS = [
    { pct: 0,   label: 'Getting started…' },
    { pct: 12,  label: 'Step 1 of 8 — Contact info' },
    { pct: 25,  label: 'Step 2 of 8 — Your challenge' },
    { pct: 37,  label: 'Step 3 of 8 — Company details' },
    { pct: 50,  label: 'Step 4 of 8 — Timeline & budget' },
    { pct: 62,  label: 'Step 5 of 8 — Project type' },
    { pct: 75,  label: 'Step 6 of 8 — Project details' },
    { pct: 88,  label: 'Step 7 of 8 — Review' },
    { pct: 100, label: 'Step 8 of 8 — All done! 🎉' },
  ];

  const SUMMARY_FIELDS = [
    { key: 'name', label: 'Name' }, { key: 'company', label: 'Company' },
    { key: 'email', label: 'Email' }, { key: 'description', label: 'Challenge' },
    { key: 'budget', label: 'Budget' }, { key: 'timeline', label: 'Timeline' },
    { key: 'type', label: 'Project type' },
  ];

  const QUICK_REPLIES = {
    greeting: ["I have a manufacturing challenge", "Looking for testing services", "Need training support", "Tell me about MMRI"],
    project_type: ["Fee-for-service", "Funded (NSERC, ORF, etc.)", "Not sure yet"],
    budget: ["Under $5,000", "$5,000 – $15,000", "$15,000 – $50,000", "Over $50,000"],
    referral: ["LinkedIn", "Google", "Word of mouth", "McMaster connection", "Conference"],
  };

  // ── Avatar ──
  function setAvatar(state) {
    ['idle','thinking','happy'].forEach(s => {
      document.getElementById(`avatar-${s}`).classList.toggle('hidden', s !== state);
    });
  }

  // ── Persistence ──
  function saveConversation() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ conversation, summaryData, step, chatStarted }));
    } catch(e) {}
  }

  function loadConversation() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return false;
      const data = JSON.parse(saved);
      if (!data.conversation || data.conversation.length === 0) return false;
      conversation = data.conversation;
      summaryData = data.summaryData || {};
      step = data.step || 0;
      chatStarted = data.chatStarted || false;
      return true;
    } catch(e) { return false; }
  }

  function restoreMessages() {
    // Re-render messages from conversation history
    const messages = document.getElementById('ethos-messages');
    messages.innerHTML = '';
    conversation.forEach(m => {
      if (m.role === 'user') {
        addUserMessage(m.content, true);
      } else {
        restoreBotMessage(m.content);
      }
    });
    renderSummary();
    document.getElementById('progress-fill').style.width = STEPS[step].pct + '%';
    document.getElementById('progress-label').innerHTML = `<span>${STEPS[step].label}</span>`;
  }

  function restoreBotMessage(text) {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = 'ethos-msg bot';
    const matchLines = [...text.matchAll(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g)];
    const followupLines = [...text.matchAll(/FOLLOWUP:\s*(.+)/g)];
    let displayText = text
      .replace(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g, '')
      .replace(/FOLLOWUP:\s*(.+)/g, '')
      .replace(/https:\/\/calendly\.com\/[^\s)]+/g, '')
      .replace(/\*\*/g, '').trim();

    let badges = '';
    if (matchLines.length > 0) {
      badges = '<div style="display:flex;flex-direction:column;gap:7px;margin-top:10px;">';
      matchLines.forEach((m, i) => {
        badges += `<div class="match-card${i > 0 ? ' secondary' : ''}">
          <div>
            <div class="match-label">${i === 0 ? 'Best match' : 'Also relevant'}</div>
            <div class="match-name">${m[1].trim()}</div>
            <div class="match-conf">${m[2]}% confidence</div>
          </div>
          ${i === 0 ? `<button class="scope-btn" onclick="downloadScoping('${m[1].trim().replace(/'/g,"\\'")}','${m[2]}')">📄 Scoping doc</button>` : ''}
        </div>`;
      });
      badges += `</div><div style="margin-top:10px;"><a class="calendly-btn" href="${CALENDLY_LINK}" target="_blank">📅 Book your meeting</a></div>`;
    }

    div.innerHTML = displayText.replace(/\n/g, '<br>') + badges;
    messages.appendChild(div);
  }

  // ── Toggle ──
  function toggleEthos() {
    isOpen = !isOpen;
    const win = document.getElementById('ethos-window');
    if (isOpen) {
      win.classList.add('open');
      // Check for saved conversation
      if (!chatStarted) {
        const hasSaved = loadConversation();
        if (hasSaved) {
          hideSplash();
          restoreMessages();
          chatStarted = true;
        }
        // else show splash
      }
    } else {
      win.classList.remove('open');
    }
  }

  function hideSplash() {
    const splash = document.getElementById('ethos-splash');
    if (!splash) return;
    splash.classList.add('hiding');
    setTimeout(() => splash.remove(), 400);
  }

  function startChat() {
    hideSplash();
    chatStarted = true;
    setTimeout(() => {
      addBotMessage("Hi there! I'm ETHOS, MMRI's intake assistant. This'll work like a quick 15-minute consult — I'll ask you a few things and connect you with the right team.\n\nTo get us started, what's your name and company?");
      setTimeout(() => addChips(QUICK_REPLIES.greeting), 400);
      advanceStep(1);
    }, 200);
  }

  // ── Progress ──
  function advanceStep(n) {
    if (n <= step) return;
    step = Math.min(n, STEPS.length - 1);
    document.getElementById('progress-fill').style.width = STEPS[step].pct + '%';
    document.getElementById('progress-label').innerHTML = `<span>${STEPS[step].label}</span>`;
    saveConversation();
  }

  // ── Summary ──
  function updateSummary(key, value) {
    if (!value || value.trim() === '') return;
    summaryData[key] = value;
    renderSummary();
    saveConversation();
  }

  function renderSummary() {
    const panel = document.getElementById('summary-panel');
    const grid = document.getElementById('summary-grid');
    const filled = SUMMARY_FIELDS.filter(f => summaryData[f.key]);
    if (filled.length === 0) return;
    panel.classList.add('visible');
    grid.innerHTML = SUMMARY_FIELDS.map(f => {
      const val = summaryData[f.key];
      return `<div class="summary-item ${val ? 'filled' : ''}">
        <span class="${val ? 'scheck' : 'spend'}">${val ? '✓' : '○'}</span>
        <span>${f.label}${val ? ': ' + (val.length > 18 ? val.substring(0,18)+'…' : val) : ''}</span>
      </div>`;
    }).join('');
  }

  function detectSummaryData(userText, botText) {
    const lower = userText.toLowerCase();
    const botLower = botText ? botText.toLowerCase() : '';
    if ((botLower.includes('name') || botLower.includes('company')) && userText.length > 2) {
      const parts = userText.split(/,|\sfrom\s|\sat\s/i);
      if (parts.length >= 2) { updateSummary('name', parts[0].trim()); updateSummary('company', parts[1].trim()); }
      else if (!summaryData.name) updateSummary('name', userText);
    }
    if (userText.includes('@')) updateSummary('email', userText.trim());
    if (lower.includes('$') || lower.includes('000') || lower.includes(' k')) updateSummary('budget', userText);
    if (lower.includes('week') || lower.includes('month') || lower.includes('year') || lower.includes('asap')) updateSummary('timeline', userText);
    if (lower.includes('fee') || lower.includes('service') || lower.includes('funded') || lower.includes('nserc') || lower.includes('orf')) updateSummary('type', userText);
    if (!summaryData.description && userText.length > 30 && (botLower.includes('challeng') || botLower.includes('problem') || botLower.includes('tell me'))) updateSummary('description', userText);
  }

  function detectContextChips(text) {
    const lower = text.toLowerCase();
    if (lower.includes('how did you hear') || lower.includes('hear about')) setTimeout(() => addChips(QUICK_REPLIES.referral), 300);
    else if (lower.includes('fee-for-service') || lower.includes('funding') || lower.includes('project type')) setTimeout(() => addChips(QUICK_REPLIES.project_type), 300);
    else if (lower.includes('budget') || lower.includes('invest')) setTimeout(() => addChips(QUICK_REPLIES.budget), 300);
  }

  function detectStep(text) {
    const lower = text.toLowerCase();
    if (lower.includes('email') || lower.includes('cra') || lower.includes('accounts payable')) advanceStep(2);
    else if (lower.includes('challenge') || lower.includes('problem') || lower.includes('one sentence')) advanceStep(2);
    else if (lower.includes('employees') || lower.includes('company size')) advanceStep(3);
    else if (lower.includes('budget') || lower.includes('timeline')) advanceStep(4);
    else if (lower.includes('fee-for-service') || lower.includes('funding mechanism')) advanceStep(5);
    else if (lower.includes('description') || lower.includes('goals') || lower.includes('outcomes')) advanceStep(6);
    else if (lower.includes('confirm') || lower.includes('look right') || lower.includes('sound good')) advanceStep(7);
    else if (lower.includes('book') || lower.includes('calendly') || lower.includes('wonderful')) advanceStep(8);
  }

  // ── Messages ──
  function addBotMessage(text) {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = 'ethos-msg bot';

    const matchLines = [...text.matchAll(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g)];
    const followupLines = [...text.matchAll(/FOLLOWUP:\s*(.+)/g)];
    let displayText = text
      .replace(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g, '')
      .replace(/FOLLOWUP:\s*(.+)/g, '')
      .replace(/https:\/\/calendly\.com\/[^\s)]+/g, '')
      .replace(/\*\*/g, '').trim();

    const isCelebration = displayText.toLowerCase().includes('wonderful') || displayText.toLowerCase().includes("let's get");

    playChime(660, 0.15, 0.05);
    setAvatar('idle');

    if (matchLines.length > 0) {
      if (!projectCreated) {
        projectCreated = true;
        const convText = conversation.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');
        fetch(`${API_URL}/api/create-project`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matched_team: matchLines[0][1].trim(), conversation_summary: convText })
        }).catch(e => console.error(e));
      }

      const searchDiv = document.createElement('div');
      searchDiv.className = 'match-searching';
      searchDiv.innerHTML = '<div class="search-spinner"></div> Finding the right team for you…';
      messages.appendChild(searchDiv);
      messages.scrollTop = messages.scrollHeight;

      setTimeout(() => {
        searchDiv.remove();
        playSuccess();
        setAvatar('happy');
        setTimeout(() => setAvatar('idle'), 3000);

        if (isCelebration) {
          ['🎉','✨','🌟'].forEach((e, i) => {
            setTimeout(() => {
              const cel = document.createElement('div');
              cel.className = 'celebration';
              cel.textContent = e;
              messages.appendChild(cel);
              messages.scrollTop = messages.scrollHeight;
            }, i * 120);
          });
        }

        let badges = '<div style="display:flex;flex-direction:column;gap:7px;margin-top:10px;">';
        matchLines.forEach((m, i) => {
          badges += `<div class="match-card${i > 0 ? ' secondary' : ''}" style="animation-delay:${i*0.12}s">
            <div>
              <div class="match-label">${i === 0 ? 'Best match' : 'Also relevant'}</div>
              <div class="match-name">${m[1].trim()}</div>
              <div class="match-conf">${m[2]}% confidence</div>
            </div>
            ${i === 0 ? `<button class="scope-btn" onclick="downloadScoping('${m[1].trim().replace(/'/g,"\\'")}','${m[2]}')">📄 Scoping doc</button>` : ''}
          </div>`;
        });
        badges += '</div>';

        let followups = '';
        followupLines.forEach(f => {
          followups += `<button class="followup-btn" onclick="answerFollowup('${f[1].replace(/'/g,"\\'")}')">💬 ${f[1]}</button>`;
        });

        div.innerHTML = displayText.replace(/\n/g, '<br>') + badges + followups +
          `<div style="margin-top:10px;"><a class="calendly-btn" href="${CALENDLY_LINK}" target="_blank">📅 Book your meeting</a></div>`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        detectStep(displayText);
        saveConversation();
      }, 1200);

      return div;
    }

    let followups = '';
    followupLines.forEach(f => {
      followups += `<button class="followup-btn" onclick="answerFollowup('${f[1].replace(/'/g,"\\'")}')">💬 ${f[1]}</button>`;
    });

    div.innerHTML = displayText.replace(/\n/g, '<br>') + followups;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    detectStep(displayText);
    detectContextChips(displayText);
    saveConversation();
    return div;
  }

  function addUserMessage(text, silent = false) {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = 'ethos-msg user';
    const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = text.replace(/\n/g, '<br>') + `<div class="msg-receipt">✓✓ ${now}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    if (!silent) saveConversation();
    return div;
  }

  function addChips(options) {
    const messages = document.getElementById('ethos-messages');
    const row = document.createElement('div');
    row.className = 'chip-row';
    options.forEach(opt => {
      const chip = document.createElement('button');
      chip.className = 'chip'; chip.textContent = opt;
      chip.onclick = () => { row.remove(); handleChip(opt); };
      row.appendChild(chip);
    });
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function handleChip(text) {
    addUserMessage(text);
    conversation.push({ role: 'user', content: text });
    callAPI();
  }

  function addTyping() {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = 'ethos-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    setAvatar('thinking');
    return div;
  }

  async function callAPI() {
    const typing = addTyping();
    try {
      const response = await fetch(`${API_URL}/api/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversation })
      });
      const data = await response.json();
      typing.remove();
      const reply = data.response;
      const lastUser = conversation[conversation.length - 1]?.content || '';
      detectSummaryData(lastUser, reply);
      addBotMessage(reply);
      conversation.push({ role: 'assistant', content: reply });
      saveConversation();
    } catch (err) {
      typing.remove();
      setAvatar('idle');
      addBotMessage('Sorry, I had trouble connecting. Please try again or email mmri-ad@mcmaster.ca');
    }
  }

  async function sendMessage() {
    const input = document.getElementById('ethos-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    document.querySelectorAll('.chip-row').forEach(r => r.remove());
    addUserMessage(text);
    conversation.push({ role: 'user', content: text });
    callAPI();
  }

  async function answerFollowup(question) {
    document.querySelectorAll('.followup-btn').forEach(b => b.remove());
    addUserMessage(question);
    conversation.push({ role: 'user', content: question });
    callAPI();
  }

  async function downloadScoping(team, confidence) {
    addBotMessage('Generating your scoping document — just a moment…');
    const conversationText = conversation.map(m => `${m.role.toUpperCase()}: ${m.content}`).join('\n');
    try {
      const response = await fetch(`${API_URL}/api/scoping`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ matched_team: team, confidence: confidence, conversation_summary: conversationText })
      });
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `MMRI_Scoping_${team.replace(/\s+/g,'_')}.pdf`; a.click();
      window.URL.revokeObjectURL(url);
    } catch (err) {
      addBotMessage('Sorry, could not generate the scoping document. Please try again.');
    }
  }
</script>
</body>
</html>
