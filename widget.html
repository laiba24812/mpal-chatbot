<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHOS · MMRI</title>
<style>
  :root {
    --space: #040810;
    --space-mid: #0A0F1C;
    --maroon: #7A003C;
    --maroon-glow: rgba(122,0,60,0.5);
    --gold: #FDBF57;
    --gold-dim: #D4A24C;
    --electric: #00D4FF;
    --electric-dim: rgba(0,212,255,0.12);
    --green-ok: #00FF88;
    --glass: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.07);
    --ink: #CDD6F4;
    --ink-soft: #6C7A96;
    --line: rgba(255,255,255,0.06);
    --chip-bg: rgba(0,212,255,0.05);
    --chip-border: rgba(0,212,255,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Helvetica Neue', Arial, sans-serif; }

  /* ── Bubble ── */
  #ethos-bubble {
    position: fixed; bottom: 24px; right: 24px;
    width: 60px; height: 60px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 9999; background: var(--space);
    border: 1.5px solid rgba(122,0,60,0.6);
    box-shadow: 0 0 20px var(--maroon-glow), 0 0 40px rgba(0,212,255,0.08), inset 0 0 20px rgba(122,0,60,0.1);
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
    animation: bubble-breathe 3s ease-in-out infinite;
  }
  @keyframes bubble-breathe {
    0%,100% { box-shadow: 0 0 20px var(--maroon-glow), 0 0 40px rgba(0,212,255,0.08); }
    50% { box-shadow: 0 0 35px var(--maroon-glow), 0 0 60px rgba(0,212,255,0.15), 0 0 80px rgba(122,0,60,0.1); }
  }
  #ethos-bubble:hover { transform: scale(1.08); }
  #ethos-bubble svg { width: 24px; height: 24px; fill: var(--gold); position: relative; z-index: 1; }
  .bubble-dot {
    position: absolute; top: 10px; right: 10px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green-ok);
    box-shadow: 0 0 6px var(--green-ok);
    animation: dot-ping 2s ease-in-out infinite;
  }
  @keyframes dot-ping {
    0%,100% { box-shadow: 0 0 4px var(--green-ok); }
    50% { box-shadow: 0 0 10px var(--green-ok), 0 0 20px rgba(0,255,136,0.3); }
  }

  /* ── Window ── */
  #ethos-window {
    position: fixed; bottom: 96px; right: 24px;
    width: 400px; height: 640px; border-radius: 16px;
    display: none; flex-direction: column; overflow: hidden;
    z-index: 9998;
    background: var(--space);
    border: 1px solid rgba(0,212,255,0.12);
    box-shadow: 0 0 0 1px rgba(122,0,60,0.08), 0 32px 80px rgba(0,0,0,0.8), 0 0 60px rgba(122,0,60,0.12), 0 0 120px rgba(0,212,255,0.04);
    position: fixed;
  }
  /* HUD corner brackets */
  #ethos-window::before {
    content: '';
    position: absolute; top: -1px; left: -1px;
    width: 20px; height: 20px;
    border-top: 2px solid var(--electric);
    border-left: 2px solid var(--electric);
    border-radius: 16px 0 0 0;
    z-index: 20; pointer-events: none;
    box-shadow: -2px -2px 8px rgba(0,212,255,0.3);
  }
  #ethos-window::after {
    content: '';
    position: absolute; bottom: -1px; right: -1px;
    width: 20px; height: 20px;
    border-bottom: 2px solid var(--maroon);
    border-right: 2px solid var(--maroon);
    border-radius: 0 0 16px 0;
    z-index: 20; pointer-events: none;
    box-shadow: 2px 2px 8px rgba(122,0,60,0.4);
  }
  #ethos-window.open { display: flex; animation: window-rise 0.35s cubic-bezier(0.16,1,0.3,1); }
  @keyframes window-rise {
    from { opacity: 0; transform: translateY(20px) scale(0.96); filter: blur(4px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* HUD corner brackets bottom-left / top-right */
  .hud-br { position: absolute; bottom: -1px; left: -1px; width: 20px; height: 20px; border-bottom: 2px solid rgba(0,212,255,0.3); border-left: 2px solid rgba(0,212,255,0.3); border-radius: 0 0 0 16px; z-index: 20; pointer-events: none; }
  .hud-tr { position: absolute; top: -1px; right: -1px; width: 20px; height: 20px; border-top: 2px solid rgba(122,0,60,0.5); border-right: 2px solid rgba(122,0,60,0.5); border-radius: 0 16px 0 0; z-index: 20; pointer-events: none; }

  /* ── Scan line ── */
  .scan-line {
    position: absolute; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), rgba(0,212,255,0.6), rgba(0,212,255,0.3), transparent);
    z-index: 5; pointer-events: none; top: 0;
    animation: scan 8s linear infinite;
    box-shadow: 0 0 8px rgba(0,212,255,0.4);
  }
  @keyframes scan {
    0% { top: 0; opacity: 0; }
    2% { opacity: 1; }
    98% { opacity: 0.3; }
    100% { top: 100%; opacity: 0; }
  }

  /* ── Canvas ── */
  #ethos-canvas { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 0; }

  /* ── Aurora (match reveal) ── */
  #ethos-aurora {
    position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 1;
    opacity: 0; transition: opacity 0.8s ease;
    background: radial-gradient(ellipse at 50% 60%, rgba(122,0,60,0.25) 0%, rgba(0,212,255,0.08) 40%, transparent 70%);
  }
  #ethos-aurora.active { opacity: 1; animation: aurora-pulse 3s ease-in-out; }
  @keyframes aurora-pulse {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ── Splash ── */
  #ethos-splash {
    position: absolute; inset: 0; z-index: 100; border-radius: 16px;
    background: var(--space);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    animation: splash-in 0.4s ease;
    pointer-events: all;
  }
  #ethos-splash.hiding { animation: splash-out 0.4s forwards; }
  @keyframes splash-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes splash-out { to { opacity: 0; transform: scale(1.02); } }

  .splash-grid {
    position: absolute; inset: 0; opacity: 0.04; border-radius: 16px; overflow: hidden;
    background-image: linear-gradient(rgba(0,212,255,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.5) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .splash-orb {
    width: 90px; height: 90px; border-radius: 50%; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 35%, rgba(0,212,255,0.2), rgba(122,0,60,0.25));
    border: 1px solid rgba(0,212,255,0.3);
    box-shadow: 0 0 30px rgba(0,212,255,0.15), 0 0 60px rgba(122,0,60,0.1), inset 0 0 30px rgba(0,212,255,0.05);
    animation: orb-breathe 3s ease-in-out infinite;
  }
  @keyframes orb-breathe {
    0%,100% { box-shadow: 0 0 30px rgba(0,212,255,0.15), 0 0 60px rgba(122,0,60,0.1); }
    50% { box-shadow: 0 0 50px rgba(0,212,255,0.3), 0 0 100px rgba(122,0,60,0.2), 0 0 20px rgba(253,191,87,0.1); }
  }
  .splash-orb::before {
    content: ''; position: absolute; inset: -10px; border-radius: 50%;
    border: 1px solid rgba(0,212,255,0.1);
    animation: ring-expand 3s ease-in-out infinite;
  }
  .splash-orb::after {
    content: ''; position: absolute; inset: -20px; border-radius: 50%;
    border: 1px solid rgba(0,212,255,0.05);
    animation: ring-expand 3s ease-in-out infinite 0.7s;
  }
  @keyframes ring-expand {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.15); opacity: 0; }
  }
  .splash-orb svg { width: 36px; height: 36px; fill: var(--gold); filter: drop-shadow(0 0 8px rgba(253,191,87,0.5)); }
  .splash-title {
    font-family: 'Georgia', serif; font-size: 32px; font-weight: 600; letter-spacing: 4px;
    background: linear-gradient(135deg, var(--gold), #fff, var(--electric));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none; filter: drop-shadow(0 0 20px rgba(253,191,87,0.3));
  }
  .splash-tagline { color: var(--electric); font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; font-family: 'Courier New', monospace; }
  .splash-sub { color: rgba(255,255,255,0.45); font-size: 12.5px; text-align: center; max-width: 260px; line-height: 1.7; }
  .splash-divider { width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--electric), transparent); }
  .splash-btn {
    background: transparent; color: var(--electric);
    border: 1px solid rgba(0,212,255,0.4); border-radius: 6px;
    padding: 12px 30px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    letter-spacing: 1.5px; text-transform: uppercase; font-family: 'Courier New', monospace;
    margin-top: 4px; transition: all 0.2s;
    position: relative; z-index: 11;
  }
  .splash-btn:hover {
    background: rgba(0,212,255,0.08); border-color: var(--electric);
    box-shadow: 0 0 20px rgba(0,212,255,0.2), inset 0 0 20px rgba(0,212,255,0.05);
    transform: translateY(-1px);
  }
  .splash-version { color: rgba(255,255,255,0.15); font-size: 9.5px; font-family: 'Courier New', monospace; letter-spacing: 1px; }

  /* ── Header ── */
  .ethos-header {
    background: rgba(4,8,16,0.95); backdrop-filter: blur(30px);
    padding: 13px 18px 11px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; overflow: hidden; flex-shrink: 0; z-index: 5;
    border-bottom: 1px solid var(--line);
  }
  .ethos-header::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--electric) 30%, var(--maroon) 70%, transparent 100%);
    opacity: 0.3;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-avatar {
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(0,212,255,0.06);
    border: 1px solid rgba(0,212,255,0.2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    position: relative; overflow: visible;
    box-shadow: 0 0 10px rgba(0,212,255,0.1);
  }
  .avatar-face { font-size: 17px; position: absolute; transition: opacity 0.25s; }
  .avatar-face.hidden { opacity: 0; }
  .header-title-group { display: flex; flex-direction: column; gap: 1px; }
  .header-name {
    font-family: 'Courier New', monospace; color: var(--gold);
    font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 7px;
    filter: drop-shadow(0 0 8px rgba(253,191,87,0.25));
  }
  .online-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--green-ok);
    box-shadow: 0 0 6px var(--green-ok); animation: dot-glow 2s ease-in-out infinite;
  }
  @keyframes dot-glow {
    0%,100% { box-shadow: 0 0 4px var(--green-ok); }
    50% { box-shadow: 0 0 12px var(--green-ok), 0 0 24px rgba(0,255,136,0.4); }
  }
  .header-sub { color: var(--ink-soft); font-size: 9.5px; letter-spacing: 0.8px; font-family: 'Courier New', monospace; }
  .header-status {
    display: flex; align-items: center; gap: 6px;
  }
  .status-pill {
    background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.2);
    color: var(--green-ok); font-size: 9px; font-family: 'Courier New', monospace;
    letter-spacing: 0.8px; padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase;
  }
  .header-close {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4); width: 26px; height: 26px; border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.15s; font-family: Arial, sans-serif;
  }
  .header-close:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.15); }

  /* ── Progress ── */
  .progress-wrap { position: relative; flex-shrink: 0; }
  .progress-bar-wrap { background: rgba(0,0,0,0.6); height: 2px; }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--maroon), #8B1A6B, var(--electric), var(--gold));
    transition: width 0.8s cubic-bezier(0.34,1.56,.64,1);
    box-shadow: 0 0 8px rgba(0,212,255,0.5), 0 0 4px rgba(253,191,87,0.3);
  }
  /* Tick marks */
  .progress-ticks {
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .tick { width: 1px; height: 4px; background: rgba(0,212,255,0.2); margin-top: -1px; }

  .progress-label {
    background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--line);
    padding: 4px 14px; font-size: 9.5px; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    font-family: 'Courier New', monospace; letter-spacing: 0.5px;
  }
  .progress-label .pl-left { color: var(--electric); }
  .progress-label .pl-right { color: rgba(255,255,255,0.2); font-size: 8.5px; }

  /* ── Summary ── */
  #summary-panel {
    background: rgba(0,212,255,0.02); border-bottom: 1px solid var(--line);
    padding: 7px 14px; flex-shrink: 0; display: none; position: relative; z-index: 2;
  }
  #summary-panel.visible { display: block; }
  .summary-title { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--electric); font-weight: 600; margin-bottom: 5px; font-family: 'Courier New', monospace; }
  .summary-grid { display: flex; flex-wrap: wrap; gap: 3px 10px; }
  .summary-item { font-size: 10.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 3px; }
  .summary-item.filled { color: var(--ink); }
  .scheck { color: var(--green-ok); font-size: 9px; }
  .spend { color: rgba(255,255,255,0.12); font-size: 9px; }

  /* ── Messages ── */
  .ethos-messages {
    flex: 1; overflow-y: auto; padding: 14px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; z-index: 2; scroll-behavior: smooth;
  }
  .ethos-messages::-webkit-scrollbar { width: 3px; }
  .ethos-messages::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.15); border-radius: 3px; }

  .ethos-msg {
    max-width: 85%; padding: 10px 14px; border-radius: 10px;
    font-size: 13px; line-height: 1.65;
    animation: msg-in 0.25s cubic-bezier(0.34,1.56,.64,1) both;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .ethos-msg.bot {
    background: rgba(255,255,255,0.03); backdrop-filter: blur(10px);
    color: var(--ink); align-self: flex-start;
    border: 1px solid var(--glass-border); border-bottom-left-radius: 3px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
    position: relative;
  }
  .msg-prefix {
    font-family: 'Courier New', monospace; font-size: 9px;
    color: var(--electric); letter-spacing: 0.5px; display: block; margin-bottom: 4px; opacity: 0.7;
  }
  .ethos-msg.user {
    background: rgba(122,0,60,0.3); backdrop-filter: blur(10px);
    color: rgba(255,255,255,0.9); align-self: flex-end; border-bottom-right-radius: 3px;
    border: 1px solid rgba(122,0,60,0.4);
    box-shadow: 0 4px 16px rgba(122,0,60,0.25), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .msg-receipt { font-size: 9.5px; color: rgba(255,255,255,0.28); text-align: right; margin-top: 4px; font-family: 'Courier New', monospace; }

  /* ── Typewriter cursor ── */
  .tw-cursor {
    display: inline-block; width: 1.5px; height: 12px; background: var(--electric);
    margin-left: 2px; vertical-align: middle;
    animation: tw-blink 0.7s step-end infinite;
    box-shadow: 0 0 6px var(--electric);
  }
  @keyframes tw-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ── Waveform typing ── */
  .ethos-typing {
    align-self: flex-start;
    background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border);
    padding: 10px 16px; border-radius: 10px; border-bottom-left-radius: 3px;
    display: flex; gap: 3px; align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .wave-bar {
    width: 3px; border-radius: 2px;
    background: var(--electric);
    box-shadow: 0 0 4px var(--electric);
    animation: wave-anim 1s ease-in-out infinite;
    min-height: 4px;
  }
  .wave-bar:nth-child(1) { animation-delay: 0s; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; background: var(--gold); box-shadow: 0 0 4px var(--gold); }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }
  .wave-bar:nth-child(6) { animation-delay: 0.3s; background: var(--maroon); box-shadow: 0 0 4px var(--maroon); }
  .wave-bar:nth-child(7) { animation-delay: 0.2s; }
  .wave-bar:nth-child(8) { animation-delay: 0.1s; }
  @keyframes wave-anim {
    0%,100% { height: 4px; opacity: 0.4; }
    50% { height: 16px; opacity: 1; }
  }

  /* ── Scanning ── */
  .match-searching {
    align-self: flex-start;
    background: rgba(0,212,255,0.03); border: 1px solid rgba(0,212,255,0.12);
    padding: 10px 16px; border-radius: 10px; border-bottom-left-radius: 3px;
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--electric);
    font-family: 'Courier New', monospace; letter-spacing: 0.5px;
    animation: msg-in 0.26s ease both;
  }
  .search-spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid rgba(0,212,255,0.15); border-top-color: var(--electric);
    animation: spin 0.6s linear infinite; flex-shrink: 0;
    box-shadow: 0 0 8px rgba(0,212,255,0.3);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Match card ── */
  .match-card {
    margin-top: 8px; padding: 14px 16px;
    background: linear-gradient(135deg, rgba(122,0,60,0.4) 0%, rgba(4,8,16,0.9) 100%);
    backdrop-filter: blur(20px);
    border-radius: 10px; border: 1px solid rgba(253,191,87,0.15);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    animation: match-reveal 0.6s cubic-bezier(0.34,1.56,.64,1) both;
    position: relative; overflow: hidden;
    box-shadow: 0 8px 32px rgba(122,0,60,0.25), 0 0 0 1px rgba(253,191,87,0.05), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .match-card::before {
    content: '';
    position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(253,191,87,0.06), rgba(0,212,255,0.04), transparent);
    animation: holo-shimmer 4s ease-in-out infinite;
  }
  @keyframes holo-shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }
  /* Classified stamp animation */
  .match-card-classified {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(2) rotate(-15deg);
    font-size: 22px; font-family: 'Courier New', monospace; font-weight: 900;
    color: var(--electric); letter-spacing: 3px; text-transform: uppercase;
    border: 2px solid var(--electric); padding: 4px 10px; border-radius: 4px;
    opacity: 0; animation: classified-stamp 1.4s ease forwards;
    text-shadow: 0 0 10px var(--electric); box-shadow: 0 0 10px rgba(0,212,255,0.3);
    white-space: nowrap;
  }
  @keyframes classified-stamp {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(2) rotate(-15deg); }
    30% { opacity: 0.9; transform: translate(-50%,-50%) scale(1.1) rotate(-8deg); }
    60% { opacity: 0.9; transform: translate(-50%,-50%) scale(1.05) rotate(-5deg); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9) rotate(-3deg); }
  }
  @keyframes match-reveal {
    from { opacity: 0; transform: scale(0.88) translateY(10px); }
    60% { box-shadow: 0 12px 50px rgba(253,191,87,0.2), 0 0 80px rgba(122,0,60,0.3); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .match-card.secondary { opacity: 0.45; animation: msg-in 0.3s ease both; }
  .match-label { color: var(--electric); font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; font-family: 'Courier New', monospace; }
  .match-name { color: var(--gold); font-size: 13px; font-weight: 700; margin-top: 3px; filter: drop-shadow(0 0 6px rgba(253,191,87,0.3)); }
  .match-conf { color: rgba(255,255,255,0.35); font-size: 10px; margin-top: 2px; font-family: 'Courier New', monospace; }
  .scope-btn {

<script>
  let audioCtx = null;
  function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
  function playChime() {
    try {
      const ctx = getAudio(), osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 523; osc.type = 'sine';
      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
  }
  function playSuccess() {
    try {
      const ctx = getAudio();
      [523, 659, 784, 1047].forEach((f, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f; osc.type = 'sine';
        const t = ctx.currentTime + i * 0.1;
        gain.gain.setValueAtTime(0.05, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
      });
    } catch(e) {}
  }
</script>

<script>
  const API_URL = "https://mpal-chatbot.onrender.com";
  const CALENDLY_LINK = "https://calendly.com/yousafzl-mcmaster/mmri-intro-call-15-min";
  const STORAGE_KEY = "ethos_v3_conv";

  let conversation = [], isOpen = false, projectCreated = false, step = 0, summaryData = {}, chatStarted = false;

  // ── Particles ──
  const particles = [];
  let animFrame;
  function initCanvas() {
    const canvas = document.getElementById('ethos-canvas');
    const win = document.getElementById('ethos-window');
    canvas.width = win.offsetWidth; canvas.height = win.offsetHeight;
    const ctx = canvas.getContext('2d');
    particles.length = 0;
    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: Math.random() * 1 + 0.3,
        vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.35 + 0.08,
        color: Math.random() > 0.6 ? '0,212,255' : Math.random() > 0.5 ? '253,191,87' : '122,0,60',
        pulse: Math.random() * Math.PI * 2,
      });
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() / 1000;
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
        if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
        const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color},${a})`; ctx.fill();
      });
      particles.forEach((p, i) => {
        particles.slice(i+1).forEach(q => {
          const d = Math.hypot(p.x-q.x, p.y-q.y);
          if (d < 70) {
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = `rgba(0,212,255,${0.05 * (1 - d/70)})`;
            ctx.lineWidth = 0.5; ctx.stroke();
          }
        });
      });
      animFrame = requestAnimationFrame(draw);
    }
    draw();
  }

  // ── Progress ticks ──
  function buildTicks() {
    const container = document.getElementById('progress-ticks');
    for (let i = 0; i < 20; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick'; container.appendChild(tick);
    }
  }
  buildTicks();

  const STEPS = [
    { pct: 0,   label: 'SYS://INIT' },
    { pct: 12,  label: 'MODULE_01://CONTACT_DATA' },
    { pct: 25,  label: 'MODULE_02://CHALLENGE_SCAN' },
    { pct: 37,  label: 'MODULE_03://ENTITY_PROFILE' },
    { pct: 50,  label: 'MODULE_04://RESOURCE_MAP' },
    { pct: 62,  label: 'MODULE_05://PROJECT_CLASS' },
    { pct: 75,  label: 'MODULE_06://SCOPE_ANALYSIS' },
    { pct: 88,  label: 'MODULE_07://VERIFICATION' },
    { pct: 100, label: 'SYS://COMPLETE ✓' },
  ];

  const SUMMARY_FIELDS = [
    { key: 'name', label: 'NAME' }, { key: 'company', label: 'ENTITY' },
    { key: 'email', label: 'CONTACT' }, { key: 'description', label: 'CHALLENGE' },
    { key: 'budget', label: 'BUDGET' }, { key: 'timeline', label: 'TIMELINE' },
    { key: 'type', label: 'TYPE' },
  ];

  const QUICK_REPLIES = {
    greeting: ["Manufacturing challenge", "Testing services", "Training support", "Tell me about MMRI"],
    project_type: ["Fee-for-service", "Funded (NSERC, ORF, etc.)", "Not sure yet"],
    budget: ["< $5,000", "$5K – $15K", "$15K – $50K", "> $50,000"],
    referral: ["LinkedIn", "Google", "Word of mouth", "McMaster", "Conference"],
  };

  function setAvatar(state) {
    ['idle','thinking','happy'].forEach(s => document.getElementById(`avatar-${s}`).classList.toggle('hidden', s !== state));
  }

  function saveConversation() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ conversation, summaryData, step, chatStarted })); } catch(e) {}
  }

  function loadConversation() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return false;
      const data = JSON.parse(saved);
      if (!data.conversation || data.conversation.length === 0) return false;
      conversation = data.conversation; summaryData = data.summaryData || {};
      step = data.step || 0; chatStarted = data.chatStarted || false;
      return true;
    } catch(e) { return false; }
  }

  function toggleEthos() {
    isOpen = !isOpen;
    const win = document.getElementById('ethos-window');
    if (isOpen) {
      win.classList.add('open');
      setTimeout(initCanvas, 50);
      if (!chatStarted) {
        const hasSaved = loadConversation();
        if (hasSaved) { hideSplash(); restoreMessages(); chatStarted = true; }
      }
    } else {
      win.classList.remove('open');
      if (animFrame) cancelAnimationFrame(animFrame);
    }
  }

  function hideSplash() {
    const s = document.getElementById('ethos-splash');
    if (!s) return;
    s.classList.add('hiding'); setTimeout(() => s.remove(), 400);
  }

  function startChat() {
    hideSplash(); chatStarted = true;
    setTimeout(() => {
      typewriterMessage("ETHOS://INIT — Session established.\n\nHello. I'm ETHOS, MMRI's AI intake system. I'll guide you through a quick consultation and match you with the right research team.\n\nTo begin: what's your name and company?");
      setTimeout(() => addChips(QUICK_REPLIES.greeting), 1200);
      advanceStep(1);
    }, 300);
  }

  function advanceStep(n) {
    if (n <= step) return;
    step = Math.min(n, STEPS.length - 1);
    document.getElementById('progress-fill').style.width = STEPS[step].pct + '%';
    document.getElementById('progress-label-text').textContent = STEPS[step].label;
    document.getElementById('progress-pct').textContent = STEPS[step].pct + '%';
    saveConversation();
  }

  function updateSummary(key, value) {
    if (!value || value.trim() === '') return;
    summaryData[key] = value; renderSummary(); saveConversation();
  }

  function renderSummary() {
    const panel = document.getElementById('summary-panel');
    const grid = document.getElementById('summary-grid');
    if (Object.keys(summaryData).length === 0) return;
    panel.classList.add('visible');
    grid.innerHTML = SUMMARY_FIELDS.map(f => {
      const val = summaryData[f.key];
      return `<div class="summary-item ${val ? 'filled' : ''}"><span class="${val ? 'scheck' : 'spend'}">${val ? '✓' : '○'}</span><span>${f.label}${val ? ': ' + (val.length > 14 ? val.substring(0,14)+'…' : val) : ''}</span></div>`;
    }).join('');
  }

  function detectSummaryData(userText, botText) {
    const lower = userText.toLowerCase(), botLower = botText ? botText.toLowerCase() : '';
    if ((botLower.includes('name') || botLower.includes('company')) && userText.length > 2) {
      const parts = userText.split(/,|\sfrom\s|\sat\s/i);
      if (parts.length >= 2) { updateSummary('name', parts[0].trim()); updateSummary('company', parts[1].trim()); }
      else if (!summaryData.name) updateSummary('name', userText);
    }
    if (userText.includes('@')) updateSummary('email', userText.trim());
    if (lower.includes('$') || lower.includes('000') || lower.includes('k')) updateSummary('budget', userText);
    if (lower.includes('week') || lower.includes('month') || lower.includes('year') || lower.includes('asap')) updateSummary('timeline', userText);
    if (lower.includes('fee') || lower.includes('funded') || lower.includes('nserc') || lower.includes('orf')) updateSummary('type', userText);
    if (!summaryData.description && userText.length > 30 && (botLower.includes('challeng') || botLower.includes('problem') || botLower.includes('tell me'))) updateSummary('description', userText);
  }

  function detectContextChips(text) {
    const lower = text.toLowerCase();
    if (lower.includes('how did you hear') || lower.includes('hear about')) setTimeout(() => addChips(QUICK_REPLIES.referral), 300);
    else if (lower.includes('fee-for-service') || lower.includes('funding') || lower.includes('project type')) setTimeout(() => addChips(QUICK_REPLIES.project_type), 300);
    else if (lower.includes('budget') || lower.includes('invest')) setTimeout(() => addChips(QUICK_REPLIES.budget), 300);
  }

  function detectStep(text) {
    const lower = text.toLowerCase();
    if (lower.includes('email') || lower.includes('cra')) advanceStep(2);
    else if (lower.includes('challenge') || lower.includes('problem')) advanceStep(2);
    else if (lower.includes('employees') || lower.includes('company size')) advanceStep(3);
    else if (lower.includes('budget') || lower.includes('timeline')) advanceStep(4);
    else if (lower.includes('fee-for-service') || lower.includes('funding mechanism')) advanceStep(5);
    else if (lower.includes('description') || lower.includes('goals')) advanceStep(6);
    else if (lower.includes('confirm') || lower.includes('sound good')) advanceStep(7);
    else if (lower.includes('wonderful') || lower.includes('book') || lower.includes('meeting')) advanceStep(8);
  }

  // ── Typewriter ──
  function typewriterMessage(text, onDone) {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = 'ethos-msg bot';
    const prefix = document.createElement('span');
    prefix.className = 'msg-prefix'; prefix.textContent = 'ETHOS://';
    div.appendChild(prefix);
    const cursor = document.createElement('span');
    cursor.className = 'tw-cursor'; div.appendChild(cursor);
    messages.appendChild(div); messages.scrollTop = messages.scrollHeight;

    const chars = text.replace(/\n/g, '\n');
    let i = 0;
    function type() {
      if (i < chars.length) {
        const c = chars[i];
        if (c === '\n') { div.insertBefore(document.createElement('br'), cursor); }
        else {
          const nodes = div.childNodes;
          let last = null;
          for (let j = nodes.length - 1; j >= 0; j--) { if (nodes[j] !== cursor && nodes[j].nodeType === 3) { last = nodes[j]; break; } }
          if (!last) { div.insertBefore(document.createTextNode(c), cursor); }
          else { last.textContent += c; }
        }
        i++; messages.scrollTop = messages.scrollHeight;
        setTimeout(type, 15);
      } else { cursor.remove(); if (onDone) onDone(); }
    }
    type(); return div;
  }

  function restoreBotMessage(text) {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className = 'ethos-msg bot';
    const matchLines = [...text.matchAll(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g)];
    let displayText = text.replace(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g,'').replace(/FOLLOWUP:\s*(.+)/g,'').replace(/https:\/\/calendly\.com\/[^\s)]+/g,'').replace(/\*\*/g,'').trim();
    let extra = '';
    if (matchLines.length > 0) {
      extra = '<div style="display:flex;flex-direction:column;gap:7px;margin-top:10px;">';
      matchLines.forEach((m, i) => {
        extra += `<div class="match-card${i>0?' secondary':''}"><div><div class="match-label">${i===0?'⬡ BEST MATCH':'◈ SECONDARY'}</div><div class="match-name">${m[1].trim()}</div><div class="match-conf">${m[2]}% CONFIDENCE</div></div>${i===0?`<button class="scope-btn" onclick="downloadScoping('${m[1].trim().replace(/'/g,"\\'")}','${m[2]}')">[ SCOPING DOC ]</button>`:''}</div>`;
      });
      extra += `</div><div style="margin-top:10px;"><a class="calendly-btn" href="${CALENDLY_LINK}" target="_blank">[ BOOK MEETING ]</a></div>`;
    }
    div.innerHTML = `<span class="msg-prefix">ETHOS://</span>${displayText.replace(/\n/g,'<br>')}${extra}`;
    messages.appendChild(div);
  }

  function restoreMessages() {
    const messages = document.getElementById('ethos-messages');
    messages.innerHTML = '';
    conversation.forEach(m => { if (m.role==='user') addUserMessage(m.content,true); else restoreBotMessage(m.content); });
    renderSummary();
    document.getElementById('progress-fill').style.width = STEPS[step].pct + '%';
    document.getElementById('progress-label-text').textContent = STEPS[step].label;
    document.getElementById('progress-pct').textContent = STEPS[step].pct + '%';
  }

  function addBotMessage(text) {
    const messages = document.getElementById('ethos-messages');
    const matchLines = [...text.matchAll(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g)];
    const followupLines = [...text.matchAll(/FOLLOWUP:\s*(.+)/g)];
    let displayText = text.replace(/MATCH:\s*([^|]+?)\s*\|\s*CONFIDENCE:\s*(\d+)%/g,'').replace(/FOLLOWUP:\s*(.+)/g,'').replace(/https:\/\/calendly\.com\/[^\s)]+/g,'').replace(/\*\*/g,'').trim();
    const isCelebration = displayText.toLowerCase().includes('wonderful') || displayText.toLowerCase().includes("let's get");
    setAvatar('idle'); playChime();

    if (matchLines.length > 0) {
      if (!projectCreated) {
        projectCreated = true;
        const convText = conversation.map(m=>`${m.role.toUpperCase()}: ${m.content}`).join('\n');
        fetch(`${API_URL}/api/create-project`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matched_team:matchLines[0][1].trim(),conversation_summary:convText})}).catch(e=>console.error(e));
      }

      const searchDiv = document.createElement('div');
      searchDiv.className = 'match-searching';
      searchDiv.innerHTML = '<div class="search-spinner"></div> SCANNING KNOWLEDGE BASE…';
      messages.appendChild(searchDiv); messages.scrollTop = messages.scrollHeight;

      setTimeout(() => {
        searchDiv.remove();
        // Aurora bloom
        const aurora = document.getElementById('ethos-aurora');
        aurora.classList.add('active');
        setTimeout(() => aurora.classList.remove('active'), 3000);

        playSuccess(); setAvatar('happy');
        setTimeout(() => setAvatar('idle'), 3000);

        if (isCelebration) {
          ['🎉','⚡','✨','🌟'].forEach((e,i) => {
            setTimeout(() => {
              const cel = document.createElement('div');
              cel.className='celebration'; cel.textContent=e;
              messages.appendChild(cel); messages.scrollTop = messages.scrollHeight;
            }, i*100);
          });
        }

        const div = document.createElement('div');
        div.className = 'ethos-msg bot';

        let badges = '<div style="display:flex;flex-direction:column;gap:7px;margin-top:10px;">';
        matchLines.forEach((m,i) => {
          const classified = i===0 ? '<div class="match-card-classified">MATCH FOUND</div>' : '';
          badges += `<div class="match-card${i>0?' secondary':''}" style="animation-delay:${i*0.15}s">${classified}<div><div class="match-label">${i===0?'⬡ BEST MATCH':'◈ SECONDARY'}</div><div class="match-name">${m[1].trim()}</div><div class="match-conf">${m[2]}% CONFIDENCE</div></div>${i===0?`<button class="scope-btn" onclick="downloadScoping('${m[1].trim().replace(/'/g,"\\'")}','${m[2]}')">[ SCOPING DOC ]</button>`:''}</div>`;
        });
        badges += '</div>';

        let followups = '';
        followupLines.forEach(f => { followups += `<button class="followup-btn" onclick="answerFollowup('${f[1].replace(/'/g,"\\'")}')">› ${f[1]}</button>`; });

        div.innerHTML = `<span class="msg-prefix">ETHOS://</span>${displayText.replace(/\n/g,'<br>')}${badges}${followups}<div style="margin-top:10px;"><a class="calendly-btn" href="${CALENDLY_LINK}" target="_blank">[ BOOK MEETING ]</a></div>`;
        messages.appendChild(div); messages.scrollTop = messages.scrollHeight;
        detectStep(displayText); saveConversation();
      }, 1600);
      return;
    }

    typewriterMessage(displayText, () => {
      const lastBot = document.querySelector('.ethos-msg.bot:last-of-type');
      followupLines.forEach(f => {
        const btn = document.createElement('button');
        btn.className='followup-btn'; btn.textContent=`› ${f[1]}`;
        btn.onclick=()=>answerFollowup(f[1]);
        if (lastBot) lastBot.appendChild(btn);
      });
      detectStep(displayText); detectContextChips(displayText); saveConversation();
    });
  }

  function addUserMessage(text, silent=false) {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div');
    div.className='ethos-msg user';
    const now = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    div.innerHTML=text.replace(/\n/g,'<br>')+`<div class="msg-receipt">SENT · ${now} · ✓✓</div>`;
    messages.appendChild(div); messages.scrollTop=messages.scrollHeight;
    if (!silent) saveConversation(); return div;
  }

  function addChips(options) {
    const messages = document.getElementById('ethos-messages');
    const row = document.createElement('div'); row.className='chip-row';
    options.forEach(opt => {
      const chip = document.createElement('button'); chip.className='chip'; chip.textContent=opt;
      chip.onclick=()=>{ row.remove(); handleChip(opt); }; row.appendChild(chip);
    });
    messages.appendChild(row); messages.scrollTop=messages.scrollHeight;
  }

  function handleChip(text) { addUserMessage(text); conversation.push({role:'user',content:text}); callAPI(); }

  function addTyping() {
    const messages = document.getElementById('ethos-messages');
    const div = document.createElement('div'); div.className='ethos-typing';
    div.innerHTML='<div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>';
    messages.appendChild(div); messages.scrollTop=messages.scrollHeight;
    setAvatar('thinking'); return div;
  }

  async function callAPI() {
    const typing = addTyping();
    try {
      const response = await fetch(`${API_URL}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:conversation})});
      const data = await response.json(); typing.remove();
      const reply = data.response;
      const lastUser = conversation[conversation.length-1]?.content||'';
      detectSummaryData(lastUser,reply); addBotMessage(reply);
      conversation.push({role:'assistant',content:reply}); saveConversation();
    } catch(err) {
      typing.remove(); setAvatar('idle');
      addBotMessage('CONNECTION ERROR. Please retry or contact mmri-ad@mcmaster.ca');
    }
  }

  async function sendMessage() {
    const input=document.getElementById('ethos-input');
    const text=input.value.trim(); if(!text) return;
    input.value=''; document.querySelectorAll('.chip-row').forEach(r=>r.remove());
    addUserMessage(text); conversation.push({role:'user',content:text}); callAPI();
  }

  async function answerFollowup(question) {
    document.querySelectorAll('.followup-btn').forEach(b=>b.remove());
    addUserMessage(question); conversation.push({role:'user',content:question}); callAPI();
  }

  async function downloadScoping(team,confidence) {
    addBotMessage('GENERATING SCOPING DOCUMENT…');
    const conversationText=conversation.map(m=>`${m.role.toUpperCase()}: ${m.content}`).join('\n');
    try {
      const response=await fetch(`${API_URL}/api/scoping`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matched_team:team,confidence:confidence,conversation_summary:conversationText})});
      const blob=await response.blob();
      const url=window.URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`MMRI_Scoping_${team.replace(/\s+/g,'_')}.pdf`; a.click();
      window.URL.revokeObjectURL(url);
    } catch(err) { addBotMessage('SCOPING DOC GENERATION FAILED. Please retry.'); }
  }
</script>
</body>
</html>
